name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode PR review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_CONTENT }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "provider": {
                "openai": {
                  "models": {
                    "gpt-5.5": {
                      "options": {
                        "reasoningEffort": "high"
                      }
                    }
                  }
                }
              }
            }
        with:
          model: openai/gpt-5.5
          variant: high
          share: false
          prompt: |
            Review this pull request as a senior maintainer.

            If an AGENTS.md file exists, read it at the start of the review.
            Review the diff in the context of the full codebase, including unchanged code it interacts with or affects.

            Focus on actionable findings:
            - Correctness bugs and behavioral regressions
            - Security, privacy, permission, or data-loss risks
            - Material performance or reliability risks

            Do not run test suites; automated checks handle that separately.
            Do not report formatting, lint, generic style, broad refactor suggestions, or pre-existing issues unless this PR makes them worse or newly reachable.
            Flag newly added "just in case" checks when the full codebase context shows they are already handled elsewhere, impossible, or not realistic in practice.

            Output format:
            - Use clean GitHub-flavored Markdown
            - Start with one concise summary paragraph
            - List findings by number, with severity, file/line, why it matters, and a suggested fix
            - Close with a brief summary and recommendations, if any

            If there are no actionable findings, respond with "LGTM 👍" on its own line, then leave a blank line before adding a concise, human-readable explanation of what you checked and why the PR looks good. Keep the approval specific to the diff and avoid generic filler or unnecessary detail.
